<!doctype html>
<html lang="pt">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, user-scalable=yes, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0">
    <title>Monitoramento de Matéria-Prima | PCP Eurofarma</title>
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;500;600;700;900&family=Source+Sans+Pro:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://eurofarma.com.br/build/assets/FormBuilderInput-BWUiK1DW.css">
    <link rel="stylesheet" href="https://eurofarma.com.br/build/assets/Accordeon-D1S1yXhm.css">
    <link rel="stylesheet" href="https://eurofarma.com.br/build/assets/ContentCarousel-BvmrVSqe.css">
    <link rel="stylesheet" href="https://eurofarma.com.br/build/assets/vue-slick-carousel-Di6UQQEn.css">
    <link rel="stylesheet" href="https://eurofarma.com.br/build/assets/YoutubePlayer-SMHC-KlY.css">
    <link rel="stylesheet" href="https://eurofarma.com.br/build/assets/app-BmmMRu5z.css">
    <style>
      body {
        font-family: 'Lato', 'Source Sans Pro', Arial, sans-serif;
        background: #f4f6fa;
        margin: 0;
        color: #222;
      }
      .header {
        background: #003366;
        color: #fff;
        padding: 24px 0 16px 0;
        text-align: center;
        box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      }
      .header h1 {
        margin: 0;
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .filtros-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        justify-content: center;
        background: #fff;
        padding: 18px 0 10px 0;
        box-shadow: 0 1px 4px rgba(0,0,0,0.03);
      }
      .filtros-bar select {
        padding: 8px 16px;
        border: 1px solid #cfd8dc;
        border-radius: 6px;
        font-size: 1rem;
        background: #f7fafc;
      }
      .cards-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 22px;
        margin: 32px auto 28px auto;
        max-width: 1200px;
        padding: 0 16px;
      }
      .insumo-card {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        padding: 22px 20px 18px 20px;
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 180px;
        transition: box-shadow 0.2s;
      }
      .insumo-card.risco {
        border: 2px solid #e53935;
        box-shadow: 0 4px 16px rgba(229,57,53,0.09);
      }
      .insumo-card h2 {
        font-size: 1.18rem;
        font-weight: 700;
        margin: 0 0 10px 0;
        color: #003366;
      }
      .insumo-info {
        display: flex;
        flex-wrap: wrap;
        gap: 18px 32px;
        margin-bottom: 10px;
      }
      .insumo-info span {
        font-size: 1rem;
        color: #444;
      }
      .badges {
        display: flex;
        gap: 6px;
        margin-top: 4px;
      }
      .badge {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 12px;
        font-size: 0.92rem;
        font-weight: 600;
        color: #fff;
      }
      .badge.liberado { background: #43a047; }
      .badge.bloqueado { background: #e53935; }
      .badge.analise { background: #fbc02d; color: #222; }
      .cobertura {
        font-size: 1rem;
        margin-top: 8px;
        font-weight: 600;
      }
      .alerta-risco {
        color: #e53935;
        font-weight: 700;
        font-size: 1.04rem;
        margin-top: 6px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .alerta-risco svg {
        width: 18px;
        height: 18px;
        vertical-align: middle;
      }
      .grafico-section {
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        max-width: 1200px;
        margin: 0 auto 30px auto;
        padding: 28px 24px 18px 24px;
      }
      .grafico-section h3 {
        margin: 0 0 18px 0;
        font-size: 1.13rem;
        color: #003366;
        font-weight: 700;
      }
      .grafico-barra {
        width: 100%;
        height: 340px;
      }
      .actions-bar {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        max-width: 1200px;
        margin: 0 auto 12px auto;
        padding: 0 16px;
      }
      .btn-notificar {
        background: #003366;
        color: #fff;
        border: none;
        padding: 10px 26px;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
        box-shadow: 0 1px 6px rgba(0,0,0,0.04);
      }
      .btn-notificar:hover {
        background: #0056b3;
      }
      .tabela-pedidos {
        width: 100%;
        max-width: 1200px;
        margin: 0 auto 32px auto;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        border-collapse: collapse;
        overflow: hidden;
      }
      .tabela-pedidos th, .tabela-pedidos td {
        padding: 12px 16px;
        text-align: left;
      }
      .tabela-pedidos th {
        background: #f1f6fa;
        color: #003366;
        font-size: 1rem;
        font-weight: 700;
        border-bottom: 2px solid #e3e8ee;
      }
      .tabela-pedidos tr:not(:last-child) td {
        border-bottom: 1px solid #e3e8ee;
      }
      .tabela-pedidos td {
        font-size: 0.98rem;
      }
      @media (max-width: 900px) {
        .cards-grid, .grafico-section, .tabela-pedidos {
          max-width: 98vw;
        }
        .grafico-section { padding: 18px 4vw 10px 4vw; }
      }
      @media (max-width: 600px) {
        .cards-grid { grid-template-columns: 1fr; }
        .grafico-section { padding: 10px 2vw 6px 2vw; }
        .actions-bar { padding: 0 2vw; }
      }
    </style>
</head>
<body>
  <div class="header">
    <h1>Monitoramento de Matéria-Prima</h1>
  </div>
  <form class="filtros-bar" id="filtrosForm" autocomplete="off">
    <label for="planta">
      <span style="font-weight:600; color:#003366;">Planta:</span>
      <select id="planta" name="planta">
        <option value="todas">Todas</option>
        <option value="itabuna">Itabuna</option>
        <option value="itaboraí">Itaboraí</option>
        <option value="barueri">Barueri</option>
      </select>
    </label>
    <label for="categoria">
      <span style="font-weight:600; color:#003366;">Categoria de Insumo:</span>
      <select id="categoria" name="categoria">
        <option value="todas">Todas</option>
        <option value="principio">Princípio Ativo</option>
        <option value="excipiente">Excipiente</option>
        <option value="embalagem">Embalagem</option>
      </select>
    </label>
  </form>
  <div class="actions-bar">
    <button class="btn-notificar" id="btnNotificar" type="button" aria-label="Notificar Compras">Notificar Compras</button>
  </div>
  <section class="cards-grid" id="cardsGrid">
    <!-- Cards de insumos críticos (renderizados via JS) -->
  </section>
  <section class="grafico-section">
    <h3>Top 10 Insumos com Menor Cobertura (dias)</h3>
    <canvas id="graficoCobertura" class="grafico-barra" aria-label="Gráfico de barras horizontais dos insumos com menor cobertura" role="img"></canvas>
  </section>
  <table class="tabela-pedidos" aria-label="Pedidos de Compra em Aberto">
    <thead>
      <tr>
        <th>Nº Pedido</th>
        <th>Fornecedor</th>
        <th>Insumo</th>
        <th>Quantidade (kg)</th>
        <th>Data Prevista de Entrega</th>
      </tr>
    </thead>
    <tbody id="pedidosBody">
      <!-- Linhas de pedidos (renderizadas via JS) -->
    </tbody>
  </table>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.3.0/dist/chart.umd.min.js"></script>
  <script>
    // Exemplo de dados realistas
    const insumos = [
      {
        nome: 'Princípio Ativo A',
        categoria: 'principio',
        planta: 'itabuna',
        estoque: 1200,
        transito: 300,
        lotes: { liberado: 2, bloqueado: 1, analise: 0 },
        cobertura: 7,
        risco: true
      },
      {
        nome: 'Excipiente B',
        categoria: 'excipiente',
        planta: 'itaboraí',
        estoque: 4200,
        transito: 0,
        lotes: { liberado: 5, bloqueado: 0, analise: 2 },
        cobertura: 18,
        risco: false
      },
      {
        nome: 'Embalagem Primária C',
        categoria: 'embalagem',
        planta: 'barueri',
        estoque: 800,
        transito: 120,
        lotes: { liberado: 1, bloqueado: 0, analise: 1 },
        cobertura: 5,
        risco: true
      },
      {
        nome: 'Princípio Ativo D',
        categoria: 'principio',
        planta: 'itabuna',
        estoque: 2000,
        transito: 100,
        lotes: { liberado: 3, bloqueado: 0, analise: 0 },
        cobertura: 12,
        risco: false
      },
      {
        nome: 'Excipiente E',
        categoria: 'excipiente',
        planta: 'itaboraí',
        estoque: 950,
        transito: 0,
        lotes: { liberado: 1, bloqueado: 1, analise: 0 },
        cobertura: 6,
        risco: true
      },
      {
        nome: 'Embalagem Secundária F',
        categoria: 'embalagem',
        planta: 'barueri',
        estoque: 3500,
        transito: 400,
        lotes: { liberado: 4, bloqueado: 0, analise: 0 },
        cobertura: 15,
        risco: false
      },
      {
        nome: 'Princípio Ativo G',
        categoria: 'principio',
        planta: 'itabuna',
        estoque: 600,
        transito: 80,
        lotes: { liberado: 0, bloqueado: 1, analise: 1 },
        cobertura: 4,
        risco: true
      },
      {
        nome: 'Excipiente H',
        categoria: 'excipiente',
        planta: 'itaboraí',
        estoque: 3000,
        transito: 0,
        lotes: { liberado: 2, bloqueado: 0, analise: 0 },
        cobertura: 11,
        risco: false
      },
      {
        nome: 'Embalagem Primária I',
        categoria: 'embalagem',
        planta: 'barueri',
        estoque: 700,
        transito: 60,
        lotes: { liberado: 1, bloqueado: 0, analise: 0 },
        cobertura: 3,
        risco: true
      },
      {
        nome: 'Princípio Ativo J',
        categoria: 'principio',
        planta: 'itabuna',
        estoque: 1500,
        transito: 0,
        lotes: { liberado: 2, bloqueado: 0, analise: 0 },
        cobertura: 9,
        risco: false
      }
    ];
    const pedidos = [
      { numero: 'PO10234', fornecedor: 'Quimifarma', insumo: 'Princípio Ativo A', quantidade: 500, entrega: '2024-07-04' },
      { numero: 'PO10235', fornecedor: 'Embalagens Brasil', insumo: 'Embalagem Primária C', quantidade: 200, entrega: '2024-07-07' },
      { numero: 'PO10236', fornecedor: 'SupraQuímica', insumo: 'Excipiente E', quantidade: 300, entrega: '2024-07-10' },
      { numero: 'PO10237', fornecedor: 'Embalagens Brasil', insumo: 'Embalagem Secundária F', quantidade: 800, entrega: '2024-07-12' },
      { numero: 'PO10238', fornecedor: 'Quimifarma', insumo: 'Princípio Ativo G', quantidade: 400, entrega: '2024-07-15' }
    ];
    function renderCards() {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';
      const planta = document.getElementById('planta').value;
      const categoria = document.getElementById('categoria').value;
      let filtrados = insumos.filter(i =>
        (planta === 'todas' || i.planta === planta) &&
        (categoria === 'todas' || i.categoria === categoria)
      );
      filtrados.forEach(insumo => {
        const card = document.createElement('div');
        card.className = 'insumo-card' + (insumo.risco ? ' risco' : '');
        card.innerHTML = `
          <h2>${insumo.nome}</h2>
          <div class="insumo-info">
            <span><strong>Estoque:</strong> ${insumo.estoque} kg</span>
            <span><strong>Em trânsito:</strong> ${insumo.transito} kg</span>
          </div>
          <div class="badges">
            <span class="badge liberado">${insumo.lotes.liberado} Liberado</span>
            <span class="badge bloqueado">${insumo.lotes.bloqueado} Bloqueado</span>
            <span class="badge analise">${insumo.lotes.analise} Em análise</span>
          </div>
          <div class="cobertura">Cobertura: <span style="color:${insumo.cobertura < 7 ? '#e53935' : '#43a047'}">${insumo.cobertura} dias</span></div>
          ${insumo.risco ? `<div class="alerta-risco"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="10" stroke="#e53935" stroke-width="2"/><path stroke="#e53935" stroke-width="2" d="M12 8v4m0 4h.01"/></svg>Risco de Ruptura</div>` : ''}
        `;
        grid.appendChild(card);
      });
    }
    function renderPedidos() {
      const tbody = document.getElementById('pedidosBody');
      tbody.innerHTML = '';
      pedidos.forEach(p => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td>${p.numero}</td><td>${p.fornecedor}</td><td>${p.insumo}</td><td>${p.quantidade}</td><td>${p.entrega}</td>`;
        tbody.appendChild(tr);
      });
    }
    function renderGrafico() {
      const ctx = document.getElementById('graficoCobertura').getContext('2d');
      const top10 = [...insumos].sort((a,b) => a.cobertura-b.cobertura).slice(0,10);
      window.coberturaChart && window.coberturaChart.destroy();
      window.coberturaChart = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: top10.map(i => i.nome),
          datasets: [{
            label: 'Cobertura (dias)',
            data: top10.map(i => i.cobertura),
            backgroundColor: top10.map(i => i.cobertura < 7 ? '#e53935' : '#43a047'),
            borderRadius: 8,
            maxBarThickness: 32
          }]
        },
        options: {
          indexAxis: 'y',
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: { enabled: true }
          },
          scales: {
            x: { beginAtZero: true, title: { display: true, text: 'Dias de Cobertura' }, grid: { color: '#e3e8ee' } },
            y: { grid: { color: '#e3e8ee' } }
          }
        }
      });
    }
    document.getElementById('filtrosForm').addEventListener('change', () => {
      renderCards();
      renderGrafico();
    });
    document.getElementById('btnNotificar').addEventListener('click', () => {
      alert('Notificação enviada ao setor de Compras para os insumos em risco de ruptura.');
    });
    // Inicialização
    renderCards();
    renderPedidos();
    renderGrafico();
  </script>
</body>
</html>
