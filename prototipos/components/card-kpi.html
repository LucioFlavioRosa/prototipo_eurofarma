<div class="ef-kpi-card" role="region" aria-label="Indicador de desempenho">
  <style>
    .ef-kpi-card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(0,39,118,0.07), 0 1.5px 4px rgba(0,39,118,0.06);
      padding: 22px 28px 18px 28px;
      min-width: 220px;
      max-width: 340px;
      display: flex;
      flex-direction: row;
      align-items: center;
      margin: 10px auto;
      font-family: 'Lato', 'Source Sans Pro', Arial, sans-serif;
      transition: box-shadow 0.2s;
    }
    .ef-kpi-card:hover {
      box-shadow: 0 4px 16px rgba(0,39,118,0.13);
    }
    .ef-kpi-card .kpi-icon {
      background: #002776;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-right: 18px;
    }
    .ef-kpi-card .kpi-icon svg {
      width: 28px;
      height: 28px;
      fill: #ffd600;
    }
    .ef-kpi-card .kpi-content {
      flex: 1;
      text-align: left;
    }
    .ef-kpi-card .kpi-title {
      font-size: 1.05rem;
      color: #002776;
      font-weight: 600;
      margin-bottom: 4px;
    }
    .ef-kpi-card .kpi-value {
      font-size: 2rem;
      font-weight: 700;
      color: #0033a0;
      margin-bottom: 2px;
    }
    .ef-kpi-card .kpi-variation {
      font-size: 1rem;
      display: flex;
      align-items: center;
      font-weight: 500;
    }
    .ef-kpi-card .kpi-variation.positive {
      color: #21b573;
    }
    .ef-kpi-card .kpi-variation.negative {
      color: #e53935;
    }
    .ef-kpi-card .kpi-variation svg {
      width: 18px;
      height: 18px;
      margin-right: 4px;
      vertical-align: middle;
    }
    @media (max-width: 600px) {
      .ef-kpi-card {
        flex-direction: column;
        align-items: flex-start;
        padding: 16px 14px 14px 14px;
        min-width: 140px;
        max-width: 98vw;
      }
      .ef-kpi-card .kpi-icon {
        margin-right: 0;
        margin-bottom: 10px;
      }
    }
  </style>
  <div class="kpi-icon" aria-hidden="true">
    <!-- Exemplo: ícone de produção -->
    <svg viewBox="0 0 24 24"><path d="M4 17h16v2H4zm0-8h16v2H4zm0 4h10v2H4z"/></svg>
  </div>
  <div class="kpi-content">
    <div class="kpi-title">Produção Realizada</div>
    <div class="kpi-value">12.500</div>
    <div class="kpi-variation positive">
      <svg viewBox="0 0 24 24"><path d="M4 12l1.41 1.41L11 7.83V20h2V7.83l5.59 5.58L20 12l-8-8-8 8z"/></svg>
      +5,2% em relação ao mês anterior
    </div>
  </div>
</div>
