  <style>
    .pcp-footer {
      background: #f4f4f4;
      color: #00358e;
      font-family: 'Lato', Arial, sans-serif;
      padding: 32px 0 12px 0;
      border-top: 2px solid #00358e;
      font-size: 1em;
    }
    .pcp-footer .footer-content {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 32px;
    }
    .pcp-footer .footer-links {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .pcp-footer .footer-links a {
      color: #00358e;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }
    .pcp-footer .footer-links a:hover {
      color: #0072ce;
    }
    .pcp-footer .social {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .pcp-footer .social a {
      display: inline-block;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #00358e;
      color: #fff;
      text-align: center;
      line-height: 32px;
      font-size: 18px;
      transition: background 0.2s;
    }
    .pcp-footer .social a:hover {
      background: #0072ce;
    }
    .pcp-footer .copyright {
      text-align: center;
      margin-top: 24px;
      color: #00358e;
      font-size: 0.95em;
    }
  </style>
