<!-- Componente: Banner de Alerta Reutilizável -->
<div class="ef-alert-banner ef-alert-info" role="alert" aria-live="polite">
  <style>
    .ef-alert-banner {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      border-radius: 6px;
      font-family: 'Lato', 'Source Sans Pro', Arial, sans-serif;
      font-size: 16px;
      margin: 16px 0;
      box-shadow: 0 2px 8px rgba(0,34,85,0.06);
      border: 1.5px solid #e0e6ed;
      position: relative;
      min-width: 260px;
      max-width: 700px;
      background: #f3f7fa;
      color: #003366;
      transition: opacity 0.2s;
    }
    .ef-alert-banner .ef-alert-icon {
      font-size: 22px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
    }
    .ef-alert-banner .ef-alert-message {
      flex: 1;
      font-size: 16px;
      color: inherit;
    }
    .ef-alert-banner .ef-alert-close {
      background: none;
      border: none;
      color: #003366;
      font-size: 20px;
      cursor: pointer;
      padding: 0 4px;
      margin-left: 10px;
      border-radius: 50%;
      transition: background 0.2s;
    }
    .ef-alert-banner .ef-alert-close:hover {
      background: #e0e6ed;
    }
    /* Tipos de alerta */
    .ef-alert-success {
      background: #e6f9f0;
      border-color: #2ecc71;
      color: #227a4d;
    }
    .ef-alert-success .ef-alert-icon { color: #2ecc71; }
    .ef-alert-warning {
      background: #fff8e1;
      border-color: #ffb300;
      color: #b26a00;
    }
    .ef-alert-warning .ef-alert-icon { color: #ffb300; }
    .ef-alert-error {
      background: #ffebee;
      border-color: #e53935;
      color: #a31516;
    }
    .ef-alert-error .ef-alert-icon { color: #e53935; }
    .ef-alert-info {
      background: #f3f7fa;
      border-color: #0070c9;
      color: #003366;
    }
    .ef-alert-info .ef-alert-icon { color: #0070c9; }
    @media (max-width: 600px) {
      .ef-alert-banner {
        font-size: 14px;
        padding: 10px 8px;
        max-width: 98vw;
      }
    }
  </style>
  <span class="ef-alert-icon" aria-hidden="true">
    <!-- Ícone padrão (info) -->
    <svg width="22" height="22" viewBox="0 0 22 22" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="10" stroke="currentColor" stroke-width="2" fill="none"/><rect x="10" y="7" width="2" height="2" rx="1" fill="currentColor"/><rect x="10" y="11" width="2" height="6" rx="1" fill="currentColor"/></svg>
  </span>
  <span class="ef-alert-message">Exemplo de mensagem informativa para o usuário.</span>
  <button type="button" class="ef-alert-close" aria-label="Fechar alerta">&times;</button>
  <script>
    (function(){
      // Função para fechar o banner
      var closeBtn = document.currentScript.parentElement.querySelector('.ef-alert-close');
      var banner = document.currentScript.parentElement;
      closeBtn.addEventListener('click', function() {
        banner.style.opacity = '0';
        setTimeout(function(){ banner.style.display = 'none'; }, 200);
      });
      // Função para trocar tipo de alerta dinamicamente
      window.setEfAlertType = function(bannerElem, type, message) {
        var types = ['success','warning','error','info'];
        types.forEach(function(t){ bannerElem.classList.remove('ef-alert-' + t); });
        bannerElem.classList.add('ef-alert-' + (type || 'info'));
        var iconSpan = bannerElem.querySelector('.ef-alert-icon');
        var icons = {
          success: '<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="10" stroke="currentColor" stroke-width="2" fill="none"/><path d="M7 12l3 3 5-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
          warning: '<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="10" stroke="currentColor" stroke-width="2" fill="none"/><rect x="10" y="6" width="2" height="7" rx="1" fill="currentColor"/><rect x="10" y="15" width="2" height="2" rx="1" fill="currentColor"/></svg>',
          error:   '<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="10" stroke="currentColor" stroke-width="2" fill="none"/><path d="M8 8l6 6M14 8l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
          info:    '<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="10" stroke="currentColor" stroke-width="2" fill="none"/><rect x="10" y="7" width="2" height="2" rx="1" fill="currentColor"/><rect x="10" y="11" width="2" height="6" rx="1" fill="currentColor"/></svg>'
        };
        iconSpan.innerHTML = icons[type] || icons.info;
        if (message) bannerElem.querySelector('.ef-alert-message').textContent = message;
      };
    })();
  </script>
</div>
