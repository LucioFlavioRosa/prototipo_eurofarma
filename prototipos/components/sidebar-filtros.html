<aside id="sidebar-filtros" class="sidebar bg-white border-end">
  <div class="accordion" id="accordionFiltros">
    <div class="accordion-item">
      <h2 class="accordion-header" id="headingPeriodo">
        <button class="accordion-button" type="button" data-bs-toggle="collapse" data-bs-target="#collapsePeriodo" aria-expanded="true" aria-controls="collapsePeriodo">
          Período
        </button>
      </h2>
      <div id="collapsePeriodo" class="accordion-collapse collapse show" aria-labelledby="headingPeriodo" data-bs-parent="#accordionFiltros">
        <div class="accordion-body">
          <label for="data-inicio" class="form-label">De:</label>
          <input type="date" id="data-inicio" class="form-control mb-2">
          <label for="data-fim" class="form-label">Até:</label>
          <input type="date" id="data-fim" class="form-control">
        </div>
      </div>
    </div>
    <div class="accordion-item">
      <h2 class="accordion-header" id="headingPlanta">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapsePlanta" aria-expanded="false" aria-controls="collapsePlanta">
          Planta
        </button>
      </h2>
      <div id="collapsePlanta" class="accordion-collapse collapse" aria-labelledby="headingPlanta" data-bs-parent="#accordionFiltros">
        <div class="accordion-body">
          <select id="select-planta" class="form-select">
            <option value="">Selecione a Planta</option>
            <option value="sp">São Paulo - Matriz</option>
            <option value="ba">Bahia</option>
            <option value="mg">Minas Gerais</option>
          </select>
        </div>
      </div>
    </div>
    <div class="accordion-item">
      <h2 class="accordion-header" id="headingProduto">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseProduto" aria-expanded="false" aria-controls="collapseProduto">
          Produto
        </button>
      </h2>
      <div id="collapseProduto" class="accordion-collapse collapse" aria-labelledby="headingProduto" data-bs-parent="#accordionFiltros">
        <div class="accordion-body">
          <input type="text" id="input-produto" class="form-control" placeholder="Buscar SKU ou nome">
          <div class="form-check mt-2">
            <input class="form-check-input" type="checkbox" value="critico" id="produto-critico">
            <label class="form-check-label" for="produto-critico">Apenas produtos críticos</label>
          </div>
        </div>
      </div>
    </div>
    <div class="accordion-item">
      <h2 class="accordion-header" id="headingStatus">
        <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#collapseStatus" aria-expanded="false" aria-controls="collapseStatus">
          Status
        </button>
      </h2>
      <div id="collapseStatus" class="accordion-collapse collapse" aria-labelledby="headingStatus" data-bs-parent="#accordionFiltros">
        <div class="accordion-body">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="ok" id="status-ok">
            <label class="form-check-label" for="status-ok">OK</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="alerta" id="status-alerta">
            <label class="form-check-label" for="status-alerta">Alerta</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" value="critico" id="status-critico">
            <label class="form-check-label" for="status-critico">Crítico</label>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="d-flex gap-2 mt-4">
    <button class="btn btn-primary w-100" id="btn-aplicar-filtros">Aplicar Filtros</button>
    <button class="btn btn-outline-secondary w-100" id="btn-limpar-filtros">Limpar Filtros</button>
  </div>
</aside>
<script>
// Responsividade: sidebar vira offcanvas em mobile
(function() {
  function handleSidebar() {
    var sidebar = document.getElementById('sidebar-filtros');
    if(window.innerWidth < 992) {
      sidebar.classList.add('offcanvas', 'offcanvas-start');
      sidebar.setAttribute('tabindex', '-1');
      sidebar.setAttribute('aria-labelledby', 'sidebarLabel');
    } else {
      sidebar.classList.remove('offcanvas', 'offcanvas-start');
      sidebar.removeAttribute('tabindex');
      sidebar.removeAttribute('aria-labelledby');
    }
  }
  window.addEventListener('resize', handleSidebar);
  document.addEventListener('DOMContentLoaded', handleSidebar);
})();
// Botões de filtro: eventos customizáveis para integração
// document.getElementById('btn-aplicar-filtros').addEventListener(...)
// document.getElementById('btn-limpar-filtros').addEventListener(...)
</script>
